name: Telegram Reminders

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 16 * * 0"
    - cron: "30 16 10,20,28,29,30,31 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which reminder job to run"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - monthly

jobs:
  daily-reminders:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run daily Telegram reminders
        run: node reminder-cron.js daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SUBSCRIBERS: ${{ secrets.TELEGRAM_SUBSCRIBERS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

  weekly-excel:
    if: github.event_name == 'schedule' && github.event.schedule == '30 16 * * 0' || github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'weekly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run weekly Telegram Excel
        run: node reminder-cron.js weekly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SUBSCRIBERS: ${{ secrets.TELEGRAM_SUBSCRIBERS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

  monthly-excel:
    if: github.event_name == 'schedule' && github.event.schedule == '30 16 10,20,28,29,30,31 * *' || github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'monthly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run monthly Telegram Excel
        run: node reminder-cron.js monthly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SUBSCRIBERS: ${{ secrets.TELEGRAM_SUBSCRIBERS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
