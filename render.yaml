services:
  - type: web
    name: dailyxp-whatsapp-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SUBSCRIBERS
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SUBSCRIBERS
        sync: false
      - key: FILE_HOST
        sync: false
  - type: cron
    name: dailyxp-reminders
    runtime: node
    plan: starter
    schedule: '* * * * *'
    buildCommand: npm install
    startCommand: node reminder-cron.js daily
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: FIREBASE_PROJECT_ID
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_PROJECT_ID
      - key: FIREBASE_CLIENT_EMAIL
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_CLIENT_EMAIL
      - key: FIREBASE_PRIVATE_KEY
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_PRIVATE_KEY
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_SUBSCRIBERS
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TELEGRAM_SUBSCRIBERS
      - key: TWILIO_SID
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_SID
      - key: TWILIO_TOKEN
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_TOKEN
      - key: TWILIO_FROM
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_FROM
      - key: SUBSCRIBERS
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: SUBSCRIBERS
      - key: FILE_HOST
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FILE_HOST
  - type: cron
    name: dailyxp-weekly-excel
    runtime: node
    plan: starter
    schedule: '30 16 * * 0'
    buildCommand: npm install
    startCommand: node reminder-cron.js weekly
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: FIREBASE_PROJECT_ID
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_PROJECT_ID
      - key: FIREBASE_CLIENT_EMAIL
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_CLIENT_EMAIL
      - key: FIREBASE_PRIVATE_KEY
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_PRIVATE_KEY
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_SUBSCRIBERS
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TELEGRAM_SUBSCRIBERS
      - key: TWILIO_SID
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_SID
      - key: TWILIO_TOKEN
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_TOKEN
      - key: TWILIO_FROM
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_FROM
      - key: SUBSCRIBERS
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: SUBSCRIBERS
      - key: FILE_HOST
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FILE_HOST
  - type: cron
    name: dailyxp-monthly-excel
    runtime: node
    plan: starter
    schedule: '30 16 10,20,28,29,30,31 * *'
    buildCommand: npm install
    startCommand: node reminder-cron.js monthly
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: FIREBASE_PROJECT_ID
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_PROJECT_ID
      - key: FIREBASE_CLIENT_EMAIL
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_CLIENT_EMAIL
      - key: FIREBASE_PRIVATE_KEY
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FIREBASE_PRIVATE_KEY
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_SUBSCRIBERS
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TELEGRAM_SUBSCRIBERS
      - key: TWILIO_SID
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_SID
      - key: TWILIO_TOKEN
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_TOKEN
      - key: TWILIO_FROM
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: TWILIO_FROM
      - key: SUBSCRIBERS
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: SUBSCRIBERS
      - key: FILE_HOST
        fromService:
          name: dailyxp-whatsapp-bot
          type: web
          envVarKey: FILE_HOST
