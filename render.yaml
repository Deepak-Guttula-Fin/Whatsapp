services:
  - type: web
    name: dailyxp-whatsapp-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DB_PATH
        value: /var/data/dailyxp.db
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SUBSCRIBERS
        sync: false
      - key: FILE_HOST
        sync: false
    disk:
      name: dailyxp-data
      mountPath: /var/data
      sizeGB: 1
